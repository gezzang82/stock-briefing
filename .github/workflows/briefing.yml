name: 주식 브리핑

on:
  schedule:
    # 메인 트리거는 외부 cron-job.org가 workflow_dispatch로 호출 (KST 09:05).
    # 여기는 백업 + 임시 테스트.
    # 멱등성 가드(snapshot_logs)가 중복 차단.
    #
    # KST 09:05 (장 개장 후 5분)에 맞춘 이유:
    #   - KIS API의 inquire-price가 장 운영 시간(09:00~15:30)에 정상 응답.
    #     그 외 시간엔 status code(매매중단/거래정지)가 비정상 반환됨.
    #   - 09:05는 시가 형성 + 첫 거래량 반영 + 가장 강한 모멘텀 시그널 시간대.
    - cron: '5 1 * * 1-5'  # 백업 — UTC 01:05 = KST 월~금 10:05
    # ⚠️ 임시 테스트 (제거 예정): 시간외 단일가/장 시작 동시호가 시간대(KST 08:00)에
    # KIS API 응답 패턴이 정상인지 확인용. 한 번 테스트 후 결과에 따라 제거 or 유지.
    - cron: '0 23 * * *'   # 임시 — UTC 23:00 = KST 매일 08:00 (시간외 단일가 시간대 테스트)
  workflow_dispatch:
    inputs:
      force:
        description: '휴장일 무시하고 강제 실행 (테스트용)'
        type: boolean
        default: false

# 동시 실행 방지 - KIS 토큰 중복 발급 차단
concurrency:
  group: stock-briefing
  cancel-in-progress: false

# GitHub Pages 배포 + DB 자동 커밋 권한
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    # GitHub Pages environment 일시 제거 (codeload 장애 대비). 복구 후 다시 추가.

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          # 푸시 권한이 있는 토큰으로 체크아웃 (DB 자동 커밋용)
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: KIS 토큰 캐시 복원
        uses: actions/cache@v4
        with:
          path: .kis_token_cache
          key: kis-token-${{ github.run_id }}
          restore-keys: |
            kis-token-

      - name: 브리핑 실행
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_IS_VIRTUAL: 'false'
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_ACCESS_TOKEN: ${{ secrets.KAKAO_ACCESS_TOKEN }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python main.py --run-now --force
          else
            python main.py --run-now
          fi

      - name: Kakao 토큰 자동 갱신 반영
        if: success() && hashFiles('/tmp/kakao_tokens_new.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          NEW_ACCESS=$(python3 -c "import json; print(json.load(open('/tmp/kakao_tokens_new.json'))['access_token'])")
          NEW_REFRESH=$(python3 -c "import json; d=json.load(open('/tmp/kakao_tokens_new.json')); print(d.get('refresh_token',''))")
          if [ -n "$NEW_ACCESS" ]; then
            echo "Kakao access_token 갱신 → Secret 업데이트"
            printf '%s' "$NEW_ACCESS" | gh secret set KAKAO_ACCESS_TOKEN --repo ${{ github.repository }}
          fi
          if [ -n "$NEW_REFRESH" ]; then
            echo "Kakao refresh_token 갱신 → Secret 업데이트"
            printf '%s' "$NEW_REFRESH" | gh secret set KAKAO_REFRESH_TOKEN --repo ${{ github.repository }}
          fi

      - name: DB + 대시보드(docs/) 자동 커밋
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # DB와 docs/(대시보드 HTML) 둘 다 변경분 확인
          if [ -n "$(git status --porcelain stock_briefing.db docs/)" ]; then
            git add stock_briefing.db docs/ 2>/dev/null || git add stock_briefing.db
            git commit -m "chore: 브리핑 결과 + 대시보드 갱신 ($(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST'))"
            # 동시 푸시 충돌 방지를 위해 rebase pull
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "변경 없음 — 커밋 생략"
          fi

      # GitHub Pages 설정: Settings → Pages → Source = "Deploy from a branch"
      # Branch: main / Folder: /docs (GitHub Pages가 root와 /docs만 지원)
      # codeload 외부 액션 의존성 없음.

      - name: 실행 결과 요약
        if: always()
        run: |
          echo "## 실행 결과" >> $GITHUB_STEP_SUMMARY
          echo "- 실행 시각 (KST): $(TZ='Asia/Seoul' date)" >> $GITHUB_STEP_SUMMARY
          if [ -f logs/briefing.log ]; then
            echo "### 마지막 로그" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -30 logs/briefing.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: 실패 시 카카오톡 알림
        if: failure()
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_ACCESS_TOKEN: ${{ secrets.KAKAO_ACCESS_TOKEN }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export KST_TIME=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M')
          python3 - <<'PY'
          import os
          from kakao_sender import send_message
          msg = (
              "🚨 주식 브리핑 워크플로우 실패\n"
              f"시각: {os.environ.get('KST_TIME', '?')} KST\n"
              f"트리거: {os.environ.get('EVENT_NAME', '?')}\n"
              f"로그: {os.environ.get('RUN_URL', '?')}"
          )
          send_message(msg)
          PY
