name: 주식 브리핑

on:
  schedule:
    - cron: '30 21 * * 0-4'  # KST 월~금 06:30
  workflow_dispatch:
    inputs:
      force:
        description: '휴장일 무시하고 강제 실행 (테스트용)'
        type: boolean
        default: false

# 동시 실행 방지 - KIS 토큰 중복 발급 차단
concurrency:
  group: stock-briefing
  cancel-in-progress: false

# GitHub Pages 배포 권한
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: DB / KIS 토큰 캐시 복원
        uses: actions/cache@v4
        with:
          path: |
            stock_briefing.db
            .kis_token_cache
          key: stock-state-${{ github.run_id }}
          restore-keys: |
            stock-state-
            stock-db-

      - name: 브리핑 실행
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_IS_VIRTUAL: 'false'
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python main.py --run-now --force
          else
            python main.py --run-now
          fi

      - name: GitHub Pages 설정
        if: hashFiles('public/index.html') != ''
        uses: actions/configure-pages@v5

      - name: Pages 아티팩트 업로드
        if: hashFiles('public/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: GitHub Pages 배포
        if: hashFiles('public/index.html') != ''
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 실행 결과 요약
        if: always()
        run: |
          echo "## 실행 결과" >> $GITHUB_STEP_SUMMARY
          echo "- 실행 시각 (KST): $(TZ='Asia/Seoul' date)" >> $GITHUB_STEP_SUMMARY
          if [ -f logs/briefing.log ]; then
            echo "### 마지막 로그" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -30 logs/briefing.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: 실패 시 Discord 알림
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          KST_TIME=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M:%S')
          LAST_LOG=""
          if [ -f logs/briefing.log ]; then
            LAST_LOG=$(tail -8 logs/briefing.log | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')
          fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "{
              \"embeds\": [{
                \"title\": \"🚨 주식 브리핑 워크플로우 실패\",
                \"color\": 15158332,
                \"fields\": [
                  {\"name\": \"시각 (KST)\", \"value\": \"$KST_TIME\", \"inline\": true},
                  {\"name\": \"트리거\", \"value\": \"${{ github.event_name }}\", \"inline\": true},
                  {\"name\": \"마지막 로그\", \"value\": \"\`\`\`${LAST_LOG:-(로그 없음)}\`\`\`\"}
                ],
                \"url\": \"$RUN_URL\"
              }]
            }" \
            "$DISCORD_WEBHOOK_URL" || true
