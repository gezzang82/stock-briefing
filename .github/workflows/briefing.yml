name: 주식 브리핑

on:
  schedule:
    - cron: '30 21 * * *'  # 매일 06:30 KST (UTC 기준 전날 21:30)
  workflow_dispatch:         # 수동 실행 버튼 활성화

jobs:
  briefing:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: DB 캐시 복원 (accuracy_tracker 데이터 유지)
        uses: actions/cache@v4
        with:
          path: stock_briefing.db
          key: stock-db-${{ github.run_id }}
          restore-keys: |
            stock-db-

      - name: 브리핑 실행
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_IS_VIRTUAL: 'false'
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_ACCESS_TOKEN: ${{ secrets.KAKAO_ACCESS_TOKEN }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py --run-now

      - name: 카카오 토큰 갱신 반영 (만료 시 자동 업데이트)
        if: always()
        run: |
          if [ -f /tmp/kakao_tokens_new.json ]; then
            NEW_ACCESS=$(jq -r '.access_token // empty' /tmp/kakao_tokens_new.json)
            NEW_REFRESH=$(jq -r '.refresh_token // empty' /tmp/kakao_tokens_new.json)
            [ -n "$NEW_ACCESS" ] && gh secret set KAKAO_ACCESS_TOKEN --body "$NEW_ACCESS" --repo "${{ github.repository }}"
            [ -n "$NEW_REFRESH" ] && gh secret set KAKAO_REFRESH_TOKEN --body "$NEW_REFRESH" --repo "${{ github.repository }}"
            echo "✅ 카카오 토큰 Secret 업데이트 완료"
          else
            echo "ℹ️  토큰 갱신 없음 (정상)"
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: 실행 결과 요약
        if: always()
        run: |
          echo "## 실행 결과" >> $GITHUB_STEP_SUMMARY
          echo "- 실행 시각 (UTC): $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- 실행 시각 (KST): $(TZ='Asia/Seoul' date)" >> $GITHUB_STEP_SUMMARY
          if [ -f logs/briefing.log ]; then
            echo "### 마지막 로그" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -20 logs/briefing.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
