name: 주간 리포트

on:
  schedule:
    - cron: '0 0 * * 0'  # 매주 일요일 09:00 KST (UTC 일요일 00:00)
  workflow_dispatch:     # 수동 실행 가능

concurrency:
  group: stock-briefing
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  report:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 주간 리포트 실행
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_ACCESS_TOKEN: ${{ secrets.KAKAO_ACCESS_TOKEN }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: python weekly_report.py

      - name: 시그널 성과 분석 캐시 갱신
        # 과거 추천 outcome → 시그널 버킷 통계를 signal_performance_cache에 저장.
        # AI 프롬프트에 참고용으로만 삽입되며, 실패해도 주간 리포트 흐름은 유지.
        continue-on-error: true
        run: python signal_performance.py

      - name: Kakao 토큰 자동 갱신 반영
        if: success() && hashFiles('/tmp/kakao_tokens_new.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          NEW_ACCESS=$(python3 -c "import json; print(json.load(open('/tmp/kakao_tokens_new.json'))['access_token'])")
          NEW_REFRESH=$(python3 -c "import json; d=json.load(open('/tmp/kakao_tokens_new.json')); print(d.get('refresh_token',''))")
          [ -n "$NEW_ACCESS" ] && printf '%s' "$NEW_ACCESS" | gh secret set KAKAO_ACCESS_TOKEN --repo ${{ github.repository }}
          [ -n "$NEW_REFRESH" ] && printf '%s' "$NEW_REFRESH" | gh secret set KAKAO_REFRESH_TOKEN --repo ${{ github.repository }}

      - name: DB 변경사항 자동 커밋
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain stock_briefing.db)" ]; then
            git add stock_briefing.db
            git commit -m "chore(db): 주간 리포트 실행 결과 반영 ($(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST'))"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "DB 변경 없음 — 커밋 생략"
          fi

      # GitHub codeload.github.com 일시 장애 대비 — 핵심 작업 보존용 continue-on-error
      - name: GitHub Pages 설정
        if: hashFiles('public/index.html') != ''
        continue-on-error: true
        uses: actions/configure-pages@v4

      - name: Pages 아티팩트 업로드
        if: hashFiles('public/index.html') != ''
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: GitHub Pages 배포
        if: hashFiles('public/index.html') != ''
        continue-on-error: true
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 실행 결과 요약
        if: always()
        run: |
          echo "## 주간 리포트 실행" >> $GITHUB_STEP_SUMMARY
          echo "- 시각 (KST): $(TZ='Asia/Seoul' date)" >> $GITHUB_STEP_SUMMARY
          echo "- 대시보드: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY

      - name: 실패 시 카카오톡 알림
        if: failure()
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_ACCESS_TOKEN: ${{ secrets.KAKAO_ACCESS_TOKEN }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export KST_TIME=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M')
          python3 - <<'PY'
          import os
          from kakao_sender import send_message
          msg = (
              "🚨 주간 리포트 워크플로우 실패\n"
              f"시각: {os.environ.get('KST_TIME', '?')} KST\n"
              f"트리거: {os.environ.get('EVENT_NAME', '?')}\n"
              f"로그: {os.environ.get('RUN_URL', '?')}"
          )
          send_message(msg)
          PY
