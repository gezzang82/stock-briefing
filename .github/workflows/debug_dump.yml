name: DB 덤프 (디버그)

on:
  workflow_dispatch:

concurrency:
  group: stock-briefing
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: DB 캐시 복원
        uses: actions/cache@v4
        with:
          path: |
            stock_briefing.db
            .kis_token_cache
          key: stock-state-dump-${{ github.run_id }}
          restore-keys: |
            stock-state-
            stock-db-

      - name: KIS raw 응답 필드명 확인
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_IS_VIRTUAL: 'false'
        run: |
          pip install -q -r requirements.txt
          python3 -c "
          import json, requests
          from config import KIS_BASE_URL
          from kis_api import kis
          url = f'{KIS_BASE_URL}/uapi/domestic-stock/v1/quotations/inquire-price'
          params = {'fid_cond_mrkt_div_code': 'J', 'fid_input_iscd': '005930'}
          resp = requests.get(url, headers=kis._headers('FHKST01010100'), params=params, timeout=10)
          data = resp.json()
          print('--- output 필드 전체 ---')
          for k, v in (data.get('output') or {}).items():
              print(f'  {k}: {repr(v)[:80]}')
          "
