name: DB 덤프 (디버그)

on:
  workflow_dispatch:

concurrency:
  group: stock-briefing
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q -r requirements.txt

      - name: KIS 투자자/프로그램 API 응답 확인
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_IS_VIRTUAL: 'false'
        run: |
          python3 -c "
          import json, requests
          from config import KIS_BASE_URL
          from kis_api import kis

          print('=== inquire-investor (FHKST01010900) ===')
          url = f'{KIS_BASE_URL}/uapi/domestic-stock/v1/quotations/inquire-investor'
          params = {'fid_cond_mrkt_div_code': 'J', 'fid_input_iscd': '005930'}
          r = requests.get(url, headers=kis._headers('FHKST01010900'), params=params, timeout=10)
          d = r.json()
          print('rt_cd:', d.get('rt_cd'), 'msg:', d.get('msg1'))
          out = d.get('output', [])
          print(f'rows: {len(out)}')
          if out:
              print('첫 행 키:', list(out[0].keys()))
              print('첫 행 샘플:', json.dumps(out[0], ensure_ascii=False)[:400])

          print()
          print('=== program-trade-by-stock (FHPPG04650100) ===')
          url2 = f'{KIS_BASE_URL}/uapi/domestic-stock/v1/quotations/program-trade-by-stock'
          r2 = requests.get(url2, headers=kis._headers('FHPPG04650100'), params=params, timeout=10)
          d2 = r2.json()
          print('rt_cd:', d2.get('rt_cd'), 'msg:', d2.get('msg1'))
          o2 = d2.get('output')
          if isinstance(o2, list):
              print(f'list len: {len(o2)}')
              if o2:
                  print('첫 행 키:', list(o2[0].keys()))
                  print('첫 행:', json.dumps(o2[0], ensure_ascii=False)[:400])
          elif isinstance(o2, dict):
              print('output 키:', list(o2.keys()))
              print(json.dumps(o2, ensure_ascii=False)[:400])
          else:
              print('output type:', type(o2).__name__)
          "
