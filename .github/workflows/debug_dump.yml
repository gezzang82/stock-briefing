name: DB 덤프 (디버그)

on:
  workflow_dispatch:

concurrency:
  group: stock-briefing
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: DB 캐시 복원
        uses: actions/cache@v4
        with:
          path: |
            stock_briefing.db
            .kis_token_cache
          key: stock-state-dump-${{ github.run_id }}
          restore-keys: |
            stock-state-
            stock-db-

      - name: KIS 검증 raw 호출
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_IS_VIRTUAL: 'false'
        run: |
          pip install -q -r requirements.txt
          python3 -c "
          from kis_api import kis
          codes = ['003550', '034730', '005740', '459790', '011230', '026910', '027040', '009420', '066570', '015760']
          print(f'{\"code\":<10}{\"KIS name\":<25}{\"current\":<12}{\"rt_cd\"}')
          print('-'*70)
          for c in codes:
              data = kis.get_stock_price(c)
              if data:
                  print(f\"{c:<10}{data['name']:<25}{data['current_price']:<12,.0f}OK\")
              else:
                  print(f'{c:<10}<None - 조회 실패>')
          "
