name: 주식 AI 브리핑

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 평일 06:30 KST (21:30 UTC)
  workflow_dispatch:            # 수동 실행 버튼

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 주식 브리핑 실행
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_IS_VIRTUAL: ${{ secrets.KIS_IS_VIRTUAL }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_ACCESS_TOKEN: ${{ secrets.KAKAO_ACCESS_TOKEN }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py --run-now

      # 카카오 토큰이 자동 갱신된 경우 GitHub Secret 업데이트
      - name: 카카오 토큰 갱신 반영
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -f /tmp/kakao_tokens_new.json ]; then
            NEW_ACCESS=$(jq -r '.access_token' /tmp/kakao_tokens_new.json)
            NEW_REFRESH=$(jq -r '.refresh_token // empty' /tmp/kakao_tokens_new.json)
            gh secret set KAKAO_ACCESS_TOKEN --body "$NEW_ACCESS" --repo ${{ github.repository }}
            if [ -n "$NEW_REFRESH" ]; then
              gh secret set KAKAO_REFRESH_TOKEN --body "$NEW_REFRESH" --repo ${{ github.repository }}
            fi
            echo "카카오 토큰 갱신 완료"
          fi

      - name: 로그 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-logs
          path: logs/
          retention-days: 7
