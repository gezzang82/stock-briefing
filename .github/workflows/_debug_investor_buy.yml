name: '[debug] 외국인기관 매매상위 API'

# ⚠️ 일회성 디버그 워크플로우 — 결과 확인 후 이 yml 파일 자체를 제거할 것.
# debug_investor_buy.py를 GitHub Actions(KIS 등록 IP 환경)에서 실행하여
# FHPTJ04400000 API 응답을 raw로 확인.
#
# 금지 (script와 동일):
#   - DB 커밋/푸시 X (contents: read 권한만 사용)
#   - 카톡 발송 X (KAKAO secret 일절 주입 안 함)
#   - GitHub Pages 배포 X
#   - briefing/추천 로직 호출 X

on:
  workflow_dispatch:
    inputs:
      market:
        description: '시장 구분'
        type: choice
        options: ['ALL', 'KOSPI', 'KOSDAQ']
        default: 'ALL'
      sort:
        description: 'FID_RANK_SORT_CLS_CODE (정렬 기준)'
        type: string
        default: '0'
      sort2:
        description: 'FID_RANK_SORT_CLS_CODE_2 (보조 정렬)'
        type: string
        default: '0'

permissions:
  contents: read   # 코드 체크아웃만 — DB push 권한 일절 없음

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      # KIS 토큰 캐시는 의도적으로 복원하지 않음 (디버그용 신선 토큰 발급).
      # 캐시 복원하면 만료된 토큰을 그대로 쓰다가 실패할 수도 있어서.

      - name: 디버그 스크립트 실행
        env:
          # 필요한 secret만 주입 — KAKAO/NAVER/OPENAI는 일절 주입 안 함
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_IS_VIRTUAL: 'false'
        run: |
          python debug_investor_buy.py \
            --market "${{ github.event.inputs.market }}" \
            --sort   "${{ github.event.inputs.sort }}" \
            --sort2  "${{ github.event.inputs.sort2 }}"

      - name: 실행 결과 안내
        if: always()
        run: |
          echo "## 디버그 실행 결과" >> $GITHUB_STEP_SUMMARY
          echo "- 시각 (KST): $(TZ='Asia/Seoul' date)" >> $GITHUB_STEP_SUMMARY
          echo "- market: ${{ github.event.inputs.market }}" >> $GITHUB_STEP_SUMMARY
          echo "- sort: ${{ github.event.inputs.sort }} / sort2: ${{ github.event.inputs.sort2 }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "위 step 'debug_investor_buy.py 실행' 로그에서 raw 응답 확인" >> $GITHUB_STEP_SUMMARY
